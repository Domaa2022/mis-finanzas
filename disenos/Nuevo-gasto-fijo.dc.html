<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo gasto fijo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#B91C1C}
a{color:#B91C1C;text-decoration:none}a:hover{color:#7F1D1D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{accent}}; font-family: 'Geist', system-ui, sans-serif; color: #18181B; position: relative; overflow: hidden">
<header style="padding: 52px 16px 24px 24px; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 24px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">Nuevo gasto fijo</h1>
<a href="Gastos-fijos.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</a>
</header>
<form style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 28px 28px 0 0">
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 24px 16px; display: flex; flex-direction: column; gap: 18px">
<fieldset style="border: 0; margin: 0; padding: 0"><legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #18181B">Tipo</legend>
<div style="display: flex; gap: 4px; padding: 4px; background: #F4F4F5; border-radius: 12px">
<label style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 8px; background: #FFFFFF; color: #18181B; font-weight: 600; box-shadow: 0 0 0 1px #D4D4D8; font-size: 14px; cursor: pointer"><input type="radio" name="m-tipo" checked style="position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0">Suscripción</label>
<label style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 8px; background: transparent; color: #52525B; font-weight: 500; font-size: 14px; cursor: pointer"><input type="radio" name="m-tipo" style="position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0">Gasto fijo</label>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="m-nombre" style="font-size: 14px; font-weight: 500; color: #18181B">Nombre</label><input id="m-nombre" type="text" placeholder="Ej. Streaming, internet, gimnasio" style="height: 50px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 16px; color: #18181B; background: #FFFFFF; box-sizing: border-box; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="m-monto" style="font-size: 14px; font-weight: 500; color: #18181B">Monto</label>
<div style="position: relative"><span style="position: absolute; left: 14px; top: 15px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 16px; color: #52525B" aria-hidden="true">L</span>
<input id="m-monto" type="text" inputmode="decimal" placeholder="0.00" style="height: 50px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 16px; color: #18181B; background: #FFFFFF; box-sizing: border-box; width: 100%; padding-left: 36px; font-family: 'Geist Mono', ui-monospace, monospace;"></div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; color: #3F3F46; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #18181B">El monto cambia cada mes (usar como estimado)</label>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 500; color: #18181B">Se cobra de</span>
<button type="button" aria-haspopup="listbox" aria-label="Se cobra de: Tarjeta de crédito, cambiar" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid #D4D4D8; border-radius: 12px; background: #FFFFFF; font: inherit; color: #18181B; text-align: left; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #6D28D9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="7" y1="15" x2="10" y2="15"></line></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Tarjeta de crédito</span><span style="font-size: 13px; color: #52525B">[Banco] · Lempiras</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
</button>
</div>
<fieldset style="border: 0; margin: 0; padding: 0"><legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #18181B">Frecuencia</legend>
<div style="display: flex; gap: 4px; padding: 4px; background: #F4F4F5; border-radius: 12px">
<label style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 8px; background: transparent; color: #52525B; font-weight: 500; font-size: 14px; cursor: pointer"><input type="radio" name="m-freq" style="position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0">Semanal</label>
<label style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 8px; background: #FFFFFF; color: #18181B; font-weight: 600; box-shadow: 0 0 0 1px #D4D4D8; font-size: 14px; cursor: pointer"><input type="radio" name="m-freq" checked style="position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0">Mensual</label>
<label style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 8px; background: transparent; color: #52525B; font-weight: 500; font-size: 14px; cursor: pointer"><input type="radio" name="m-freq" style="position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0">Anual</label>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="m-dia" style="font-size: 14px; font-weight: 500; color: #18181B">Día de cobro</label><div style="position: relative"><select id="m-dia" style="height: 50px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 16px; color: #18181B; background: #FFFFFF; box-sizing: border-box; width: 100%; appearance: none; -webkit-appearance: none; padding-right: 44px"><option>Día 25 de cada mes</option><option>Último día del mes</option><option>Elegir fecha</option></select><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 14px; top: 16px; pointer-events: none" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="m-rec" style="font-size: 14px; font-weight: 500; color: #18181B">Recordatorio</label><div style="position: relative"><select id="m-rec" style="height: 50px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 16px; color: #18181B; background: #FFFFFF; box-sizing: border-box; width: 100%; appearance: none; -webkit-appearance: none; padding-right: 44px"><option>1 día antes</option><option>3 días antes</option><option>El mismo día</option><option>Sin recordatorio</option></select><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 14px; top: 16px; pointer-events: none" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></div></div>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Registrar el gasto automáticamente</span><span style="font-size: 13px; color: #71717A">El día del cobro se anota solo. Si lo apagas, te preguntamos primero.</span></span>
<span style="position: relative; flex: none; width: 48px; height: 28px; border-radius: 999px; background: #18181B">
<input type="checkbox" checked role="switch" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer">
<span style="position: absolute; top: 3px; left: 23px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span>
</span>
</label>
</div>
<div style="padding: 12px 24px 28px; border-top: 1px solid #F4F4F5; background: #FFFFFF">
<button type="submit" style="width: 100%; height: 52px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600">Guardar</button>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B91C1C","options":["#B91C1C","#991B1B","#7F1D1D","#DC2626"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B91C1C' };
  }
}
</script>
</body>
</html>
