<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Transferir entre cuentas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#B91C1C}
a{color:#B91C1C;text-decoration:none}a:hover{color:#7F1D1D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{accent}}; font-family: 'Geist', system-ui, sans-serif; color: #18181B; position: relative; overflow: hidden">
<header style="padding: 52px 16px 24px 24px; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 24px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">Transferir</h1>
<a href="Mis-cuentas.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</a>
</header>
<form style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 28px 28px 0 0">
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 24px 16px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 500; color: #18181B">Desde</span>
<button type="button" aria-haspopup="listbox" aria-label="Desde: Cuenta corriente, cambiar cuenta" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid #D4D4D8; border-radius: 12px; background: #FFFFFF; font: inherit; color: #18181B; text-align: left; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #1D4ED8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 4l9 6"></path><line x1="5" y1="10" x2="5" y2="18"></line><line x1="10" y1="10" x2="10" y2="18"></line><line x1="14" y1="10" x2="14" y2="18"></line><line x1="19" y1="10" x2="19" y2="18"></line><line x1="3" y1="20" x2="21" y2="20"></line></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Cuenta corriente</span><span style="font-size: 13px; color: #52525B">[Banco] · Disponible L 0.00</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
</button>
</div>
<div style="display: flex; justify-content: center; margin: -10px 0">
<button type="button" aria-label="Intercambiar cuentas" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #D4D4D8; background: #FFFFFF; color: #18181B; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"></path><polyline points="3 8 7 4 11 8"></polyline><path d="M17 20V4"></path><polyline points="13 16 17 20 21 16"></polyline></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 500; color: #18181B">Hacia</span>
<button type="button" aria-haspopup="listbox" aria-label="Hacia: Cuenta de ahorro, cambiar cuenta" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid #D4D4D8; border-radius: 12px; background: #FFFFFF; font: inherit; color: #18181B; text-align: left; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 10px; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7h-1.2A6 6 0 0 0 7 9H5a2 2 0 0 0 0 4h1a7 7 0 0 0 3 4v3h3v-2h2v2h3v-3.5a6 6 0 0 0 2-4.5V7z"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Cuenta de ahorro</span><span style="font-size: 13px; color: #52525B">[Banco] · Lempiras</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0">
<label for="m-monto" style="font-size: 14px; font-weight: 500; color: #52525B">Monto a transferir</label>
<div style="display: flex; align-items: baseline; justify-content: center; gap: 8px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 20px; color: #71717A" aria-hidden="true">L</span>
<input id="m-monto" type="text" inputmode="decimal" placeholder="0.00" style="width: 220px; border: 0; border-bottom: 2px solid #E4E4E7; padding: 0 0 4px; background: transparent; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 40px; font-weight: 500; color: #18181B; text-align: center">
</div>
<div style="display: flex; gap: 8px; margin-top: 6px">
<button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #E4E4E7; border-radius: 999px; background: #FAFAF9; font: inherit; font-size: 13px; color: #3F3F46; cursor: pointer">Todo el saldo</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="m-fecha" style="font-size: 14px; font-weight: 500; color: #18181B">Fecha</label>
<input id="m-fecha" type="text" value="Hoy, 22 nov 2026" style="height: 50px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 16px; color: #18181B; background: #FFFFFF; box-sizing: border-box; width: 100%">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="m-nota" style="font-size: 14px; font-weight: 500; color: #18181B">Nota <span style="color: #71717A; font-weight: 400">(opcional)</span></label>
<input id="m-nota" type="text" placeholder="Ej. Ahorro de la quincena" style="height: 50px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 16px; color: #18181B; background: #FFFFFF; box-sizing: border-box; width: 100%">
</div>
</div>
<p style="margin: 0; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: #F4F4F5; border-radius: 10px; font-size: 13px; line-height: 1.45; color: #3F3F46">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 1px" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="11" x2="12" y2="16"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
<span>Las transferencias entre tus cuentas no se cuentan como gasto ni como ingreso.</span>
</p>
</div>
<div style="padding: 12px 24px 28px; border-top: 1px solid #F4F4F5; background: #FFFFFF">
<button type="submit" style="width: 100%; height: 52px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600">Transferir</button>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B91C1C","options":["#B91C1C","#991B1B","#7F1D1D","#DC2626"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B91C1C' };
  }
}
</script>
</body>
</html>
