<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Iniciar sesión — error de acceso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#B91C1C}
a{color:#B91C1C;text-decoration:none}a:hover{color:#7F1D1D;text-decoration:underline}
input::placeholder{color:#A1A1AA}
input:focus{outline:2px solid #18181B;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{accent}}; font-family: 'Geist', system-ui, sans-serif; color: #18181B">

<header style="padding: 56px 24px 28px; color: #FFFFFF; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="15" width="5" height="10" rx="1" fill="#FFFFFF"></rect><rect x="11.5" y="9" width="5" height="16" rx="1" fill="#FFFFFF"></rect><rect x="20" y="3" width="5" height="22" rx="1" fill="#FECACA"></rect></svg>
<span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Mis Finanzas</span>
</div>
<p style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.025em">Controla tus gastos.<br><span style="color: #FECACA">Haz crecer tus ahorros.</span></p>
</header>

<section style="flex: 1; box-sizing: border-box; padding: 28px 24px 28px; display: flex; flex-direction: column; justify-content: space-between; background: #FFFFFF; border-radius: 28px 28px 0 0">
<form style="display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0 0 4px; font-size: 24px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">Inicia sesión</h1>

<div role="alert" style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid #FCD34D; border-radius: 8px; background: #FFFBEB">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{warn}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600; color: #18181B">No pudimos iniciar tu sesión</span>
<span style="font-size: 14px; line-height: 1.45; color: #3F3F46">El correo o la contraseña no coinciden.</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="e-email" style="font-size: 14px; font-weight: 500">Correo electrónico</label>
<input id="e-email" type="email" value="ana.lopez@correo.com" autocomplete="email" style="height: 50px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 16px; color: #18181B; background: #FFFFFF; box-sizing: border-box">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="e-pass" style="font-size: 14px; font-weight: 500">Contraseña</label>
<div style="position: relative">
<input id="e-pass" type="password" value="contrasena" aria-invalid="true" aria-describedby="e-pass-msg" autocomplete="current-password" style="width: 100%; height: 50px; padding: 0 52px 0 14px; border: 2px solid {{warn}}; border-radius: 8px; font: inherit; font-size: 16px; color: #18181B; background: #FFFFFF; box-sizing: border-box">
<button type="button" aria-label="Mostrar contraseña" style="position: absolute; top: 3px; right: 2px; width: 44px; height: 44px; border: 0; background: transparent; color: #52525B; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
<span id="e-pass-msg" style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{warn}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="7" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
Contraseña incorrecta
</span>
</div>

<button type="submit" style="height: 52px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600">Iniciar sesión</button>

<div style="display: flex; justify-content: center; gap: 16px">
<button type="button" aria-label="Iniciar sesión con Google" style="width: 64px; height: 52px; border: 1px solid #D4D4D8; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
<span style="width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed #A1A1AA; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #3F3F46">G</span>
</button>
<button type="button" aria-label="Iniciar sesión con Facebook" style="width: 64px; height: 52px; border: 1px solid #D4D4D8; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
<span style="width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed #A1A1AA; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #3F3F46">f</span>
</button>
</div>
</form>

<p style="margin: 0; font-size: 14px; color: #52525B; text-align: center">¿No tienes cuenta? <a href="#" style="font-weight: 600">Crea una gratis</a></p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B91C1C","options":["#B91C1C","#991B1B","#7F1D1D","#DC2626"]},"warn":{"editor":"color","default":"#B45309","options":["#B45309","#92400E","#18181B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B91C1C', warn: this.props.warn ?? '#B45309' };
  }
}
</script>
</body>
</html>
